plugins {
    id 'java'
    id 'io.qameta.allure' version "4.3.0"
}
def allureVersion = "2.34.0"

allure {
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation"io.qameta.allure:allure-junit5:$allureVersion"
    testImplementation"io.qameta.allure:allure-selenide:$allureVersion"
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
    testImplementation("com.codeborne:selenide:7.17.0")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    implementation("net.datafaker:datafaker:2.7.0")
}

test {
    useJUnitPlatform()
}

tasks.register('positiveTest', Test) {
    group = 'verification'
    description = 'Запускает все позитивные тесты'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    outputs.upToDateWhen { false }//отключение проверки актуальности задачи(тесты кааждый раз запускаются)

    useJUnitPlatform {
        includeTags 'Positive'
    }
}

tasks.register('negativeTest', Test) {
    group = 'verification'
